name: Deploy to HostGator

on:
  push:
    branches: [main]
  schedule:
    # Refreshes player-stats.json from the ACHA feed and redeploys, even if
    # no code changed. See README "Player stats auto-refresh" for why this
    # exists and how to change the cadence.
    - cron: '0 8,16 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Refresh player stats from ACHA feed
        run: npm run fetch:player-stats
        continue-on-error: true

      - run: npm run build

      - name: Upload to HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .htaccess
